<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <!-- Ruta corregida a la carpeta de imágenes -->
            <img src="assets/img/Logo.jpg" alt="Logo Ferretería Los Maestros" class="logo">
            <h1>Ferretería Los Maestros</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta para gestionar tus pedidos o tu cuenta corriente.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="ejemplo@gmail.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ferretería Los Maestros - La Serena, Región de Coquimbo.</p>
    </footer>

    <script src="assets/js/validations.js"></script>
</body>
</html>
