<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="assets/img/logo.jpg" alt="Logo Ferretería Los Maestros" class="logo"> /* Esto cambió */
            <h1>Ferretería Los Maestros</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="cart-section">
            <h2>Tu Carrito de Compras</h2>
            
            <!-- Contenedor para la tabla o mensaje de carrito vacío -->
            <div id="cartContainer">
                <!-- Se dibuja dinámicamente desde cart.js -->
            </div>

            <!-- Resumen y Checkout -->
            <div id="cartSummary" class="cart-summary hidden">
                <div class="summary-total">
                    <h3>Total a Pagar: <span id="cartTotal">$0</span></h3>
                </div>
                <div class="cart-actions">
                    <button id="btnClearCart" class="btn-secondary">Vaciar Carrito</button>
                    <button id="btnCheckout" class="btn-primary">Proceder al Pago</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ferretería Los Maestros - La Serena, Región de Coquimbo.</p>
    </footer>

    <script src="assets/js/cart.js"></script>
</body>
</html>
