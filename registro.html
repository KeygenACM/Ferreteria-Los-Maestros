<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="assets/img/logo.jpg" alt="Logo" class="logo">
            <h1>Ferretería Los Maestros</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-section wide">
            <h2>Crear Cuenta</h2>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="run">RUN (sin puntos ni guion):</label>
                    <input type="text" id="run" name="run" placeholder="19011022K" maxlength="9" required>
                    <span class="error-message" id="runError"></span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50" required>
                    <span class="error-message" id="nombreError"></span>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100" required>
                    <span class="error-message" id="apellidosError"></span>
                </div>

                <div class="form-group">
                    <label for="regren">Región:</label>
                    <select id="region" name="region" required>
                        <option value="">Seleccione Región</option>
                        <option value="coquimbo">Coquimbo</option>
                        <option value="santiago">Metropolitana</option>
                    </select>
                    <span class="error-message" id="regionError"></span>
                </div>

                <div class="form-group">
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" name="comuna" required disabled>
                        <option value="">Seleccione Comuna</option>
                    </select>
                    <span class="error-message" id="comunaError"></span>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
        </section>
    </main>

    <script src="assets/js/validations.js"></script>
</body>
</html>
