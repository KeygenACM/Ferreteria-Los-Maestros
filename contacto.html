<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="assets/img/logo.jpg" alt="Logo Ferretería Los Maestros" class="logo"> /* Esto cambió */
            <h1>Ferretería Los Maestros</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cart.html">Carrito (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="admin-section">
            <h2>Formulario de Contacto</h2>
            <form id="contactForm" class="custom-form">
                <div class="form-group">
                    <label for="contactName">Nombre Completo:</label>
                    <input type="text" id="contactName" required>
                </div>
                <div class="form-group">
                    <label for="contactEmail">Correo Electrónico:</label>
                    <input type="email" id="contactEmail" required>
                </div>
                <div class="form-group">
                    <label for="contactMessage">Mensaje o Consulta:</label>
                    <textarea id="contactMessage" rows="5" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enviar Mensaje</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ferretería Los Maestros.</p>
    </footer>

    <script src="assets/js/cart.js"></script>
</body>
</html>
